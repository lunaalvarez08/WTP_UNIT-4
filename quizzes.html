<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>National Specialist Engine - Unit 4 Hub</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        /* Restoration of your Navigation */
        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .logo { color: white; font-weight: 800; font-size: 1.2rem; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; opacity: 0.8; transition: 0.3s; }
        nav a:hover { opacity: 1; color: var(--gold); }

        .container { max-width: 900px; margin: 40px auto; width: 95%; }

        /* Modern Tab Navigation */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tab-btn { 
            background: white; border: 1px solid #ddd; padding: 10px 20px; 
            border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; 
            transition: 0.3s; color: #666; 
        }
        .tab-btn.active { background: var(--navy); color: white; border-color: var(--navy); box-shadow: 0 4px 12px rgba(10,40,95,0.2); }

        /* Glass Cards */
        .quiz-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 28px; padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center; position: relative;
        }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; text-align: left; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--navy); margin-bottom: 5px; text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; 
            font-family: inherit; font-size: 0.9rem; box-sizing: border-box;
        }

        /* Specialized Question Styles */
        .q-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 800; font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
        .q-text { font-size: 1.3rem; color: var(--navy); font-weight: 700; margin-bottom: 30px; line-height: 1.4; text-align: left; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn {
            background: white; border: 2px solid #e2e8f0; padding: 18px; border-radius: 15px;
            cursor: pointer; font-size: 1rem; transition: 0.2s; text-align: left; font-weight: 500;
        }
        .option-btn:hover { border-color: var(--gold); background: #fefce8; }
        .option-btn.correct { background: var(--green) !important; color: white; border-color: var(--green); }
        .option-btn.wrong { background: var(--red) !important; color: white; border-color: var(--red); animation: shake 0.4s; }

        .btn-main { background: var(--navy); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.1rem; }
        .hidden { display: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>

    // ===== SPECIALIST ENGINE LOGIC =====
let currentQuestions = [];
let streak = 0;

// Tab switching logic
function switchTab(tab) {
    const views = ['play', 'arch', 'bank', 'active'];
    views.forEach(t => {
        const view = document.getElementById('view-' + t);
        const tabBtn = document.getElementById('tab-' + t);
        if (view) view.classList.add('hidden');
        if (tabBtn) tabBtn.classList.remove('active');
    });
    const targetView = document.getElementById('view-' + tab);
    if (targetView) targetView.classList.remove('hidden');
    const targetTab = document.getElementById('tab-' + tab);
    if (targetTab) targetTab.classList.add('active');
}

// Function to trigger the drill
function startSpecialistQuiz() {
    const mem = document.getElementById('playMember').value;
    const top = document.getElementById('playTopic').value;
    
    // Check the bank
    if (masterQuestionBank[mem] && masterQuestionBank[mem][top]) {
        currentQuestions = masterQuestionBank[mem][top];
    }

    if (currentQuestions.length === 0) {
        alert("The evidence for " + mem + " " + top + " is still being loaded.");
        return;
    }

    streak = 0;
    document.getElementById('memberLabel').innerText = mem + " Specialist Drill " + top;
    switchTab('active');
    renderQuestion();
}

// Function to display scenarios
function renderQuestion() {
    const q = currentQuestions[Math.floor(Math.random() * currentQuestions.length)];
    document.getElementById('qText').innerText = q.scenario;
    document.getElementById('streakLabel').innerText = "STREAK " + streak;
    
    const grid = document.getElementById('options');
    grid.innerHTML = '';

    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn'; 
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q.correct, btn);
        grid.appendChild(btn);
    });
}

// Answer checking logic
function checkAnswer(selected, correct, btn) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        streak++;
        setTimeout(renderQuestion, 1000);
    } else {
        btn.classList.add('wrong');
        buttons.forEach(b => {
            if (b.innerText === correct) b.classList.add('correct');
        });
        streak = 0;
        setTimeout(renderQuestion, 2500);
    }
}            // UI LOGIC
