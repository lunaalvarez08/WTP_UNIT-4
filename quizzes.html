<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Specialist Engine - Unit 4 Hub</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .logo { color: white; font-weight: 800; font-size: 1.2rem; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; opacity: 0.8; transition: 0.3s; }
        nav a:hover { opacity: 1; color: var(--gold); }

        .container { max-width: 900px; margin: 40px auto; width: 95%; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tab-btn { 
            background: white; border: 1px solid #ddd; padding: 10px 20px; 
            border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; 
            transition: 0.3s; color: #666; 
        }
        .tab-btn.active { background: var(--navy); color: white; border-color: var(--navy); box-shadow: 0 4px 12px rgba(10,40,95,0.2); }

        .quiz-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 28px; padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center; position: relative;
        }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; text-align: left; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--navy); margin-bottom: 5px; text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; 
            font-family: inherit; font-size: 0.9rem; box-sizing: border-box;
        }

        .q-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 800; font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
        .q-text { font-size: 1.3rem; color: var(--navy); font-weight: 700; margin-bottom: 30px; line-height: 1.4; text-align: left; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn {
            background: white; border: 2px solid #e2e8f0; padding: 18px; border-radius: 15px;
            cursor: pointer; font-size: 1rem; transition: 0.2s; text-align: left; font-weight: 500;
        }
        .option-btn:hover { border-color: var(--gold); background: #fefce8; }
        .option-btn.correct { background: var(--green) !important; color: white; border-color: var(--green); }
        .option-btn.wrong { background: var(--red) !important; color: white; border-color: var(--red); animation: shake 0.4s; }

        .btn-main { background: var(--navy); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.1rem; }
        .hidden { display: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">WE THE PEOPLE</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="team.html">Team</a>
            <a href="practice.html">Practice</a>
            <a href="evidence.html">Charts</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="quizzes.html">Quizzes</a>
        </nav>
    </header>

    <div class="container">
        <div class="tabs">
            <button id="tab-play" class="tab-btn active" onclick="switchTab('play')">Quizzes</button>
        </div>

        <div id="view-play" class="quiz-card">
            <h2 style="color: var(--navy); margin:0 0 10px 0;">Specialist Drill</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Select your focus area to begin testing your evidence bank.</p>

            <div class="input-row">
                <div class="input-group">
                    <label>Specialist Member</label>
                    <select id="playMember">
                        <option value="Luna">Luna</option>
                        <option value="Sarah">Sarah</option>
                        <option value="Evan">Evan</option>
                        <option value="Bekim">Bekim</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Assigned Question</label>
                    <select id="playTopic">
                        <option value="Q1">Question 1</option>
                        <option value="Q2">Question 2</option>
                        <option value="Q3">Question 3</option>
                    </select>
                </div>
            </div>

            <button class="btn-main" onclick="startSpecialistQuiz()">Launch Quiz</button>
        </div>

        <div id="view-active" class="quiz-card hidden">
            <div class="q-header">
                <span id="memberLabel">QUIZ MODE</span>
                <span id="streakLabel">STREAK: 0</span>
            </div>
            <div id="qText" class="q-text">Loading scenario...</div>
            <div id="options" class="options-grid"></div>
        </div>
    </div>

    <script>
        const masterQuestionBank = {
            "Luna": {
                "Q1": [
                    {
                        scenario: "Congress passes a law to create a safety agency but provides no clear guidance on its limits. Which doctrine would a court likely use to challenge this?",
                        options: ["A) The Vesting Clause", "B) Major Questions Doctrine", "C) The Supremacy Clause", "D) The 2nd Amendment"],
                        correct: "B) Major Questions Doctrine"
                    },
                    {
                        scenario: "Why does the 1970 OSHA Act allow Congress to delegate power to administrative agencies?",
                        options: ["A) To bypass the Supreme Court", "B) To handle technical workplace safety issues that Congress lacks the expertise to manage daily", "C) Because the President ordered it in an Executive Order", "D) To remove power from the States"],
                        correct: "B) To handle technical workplace safety issues that Congress lacks the expertise to manage daily"
                    }
                ],
                "Q2": [],
                "Q3": [
                    {
                        scenario: "In Hamdi v. Rumsfeld, the Court decided that U.S. citizen detainees have a right to what?",
                        options: ["A) Immediate release", "B) A chance to challenge their detention before a neutral decision maker", "C) A trial in military court only", "D) No rights if they are captured on a battlefield"],
                        correct: "B) A chance to challenge their detention before a neutral decision maker"
                    }
                ]
            },
            "Sarah": {
                "Q1": [],
                "Q2": [],
                "Q3": [
                    {
                        scenario: "Sarah's 2026 evidence includes the Liam Conejo case. What is the central focus of this legal challenge?",
                        options: ["A) Patent law and technology", "B) The detention practices of ICE", "C) Freedom of speech in schools", "D) Tax collection procedures"],
                        correct: "B) The detention practices of ICE"
                    },
                    {
                        scenario: "Which case established that the state cannot detain a person in a mental facility if they are not dangerous and no longer mentally ill?",
                        options: ["A) Bell v. Wolfish", "B) Foucha v. Louisiana", "C) Kansas v. Hendricks", "D) Marbury v. Madison"],
                        correct: "B) Foucha v. Louisiana"
                    }
                ]
            },
            "Evan": {
                "Q1": [],
                "Q2": [],
                "Q3": [
                    {
                        scenario: "In SEC v. Jarkesy (2024), the Court ruled that the 7th Amendment entitles defendants to a jury trial for what?",
                        options: ["A) Criminal murder cases", "B) Civil penalties for fraud brought by an agency", "C) All speeding tickets", "D) Disputes between two different states"],
                        correct: "B) Civil penalties for fraud brought by an agency"
                    },
                    {
                        scenario: "Which landmark case is used to argue that bail cannot be set higher than what is needed to ensure the defendant shows up for trial?",
                        options: ["A) Demore v. Kim", "B) Stack v. Boyle", "C) United States v. Nixon", "D) Hamdi v. Rumsfeld"],
                        correct: "B) Stack v. Boyle"
                    }
                ]
            },
            "Bekim": {
                "Q1": [],
                "Q2": [],
                "Q3": [
                    {
                        scenario: "Section 412 of the U.S. Patriot Act is often criticized by Bekim for potentially violating which right?",
                        options: ["A) The 2nd Amendment", "B) Due process and the right to a speedy trial for non citizens", "C) The right to property", "D) Freedom of the press"],
                        correct: "B) Due process and the right to a speedy trial for non citizens"
                    },
                    {
                        scenario: "The case Carlson v. Landon (1952) dealt with the detention of active Communist Party members. What was the court's stance on bail in that instance?",
                        options: ["A) Bail is a mandatory right for everyone", "B) The Executive can deny bail to non citizens deemed a threat to national security", "C) Only Congress can set bail amounts", "D) Non citizens have no rights under the 8th Amendment"],
                        correct: "B) The Executive can deny bail to non citizens deemed a threat to national security"
                    }
                ]
            }
        };

        let currentQuestions = [];
        let streak = 0;

        function switchTab(tab) {
            const views = ['play', 'active'];
            views.forEach(v => {
                const view = document.getElementById('view-' + v);
                const btn = document.getElementById('tab-' + v);
                if (view) view.classList.add('hidden');
                if (btn) btn.classList.remove('active');
            });
            document.getElementById('view-' + tab).classList.remove('hidden');
            if (document.getElementById('tab-' + tab)) document.getElementById('tab-' + tab).classList.add('active');
        }

        function startSpecialistQuiz() {
            const member = document.getElementById('playMember').value;
            const topic = document.getElementById('playTopic').value;
            
            if (masterQuestionBank[member] && masterQuestionBank[member][topic] && masterQuestionBank[member][topic].length > 0) {
                currentQuestions = [...masterQuestionBank[member][topic]];
                streak = 0;
                document.getElementById('memberLabel').innerText = member + " Specialist " + topic;
                switchTab('active');
                renderQuestion();
            } else {
                alert("The bank for " + member + " " + topic + " is currently empty.");
            }
        }

        function renderQuestion() {
            if (currentQuestions.length === 0) {
                alert("Session complete! Restarting the drill.");
                startSpecialistQuiz();
                return;
            }
            
            const qIndex = Math.floor(Math.random() * currentQuestions.length);
            const q = currentQuestions[qIndex];
            document.getElementById('qText').innerText = q.scenario;
            document.getElementById('streakLabel').innerText = "STREAK: " + streak;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt, q.correct, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function handleAnswer(selected, correct, btn) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                streak++;
                setTimeout(renderQuestion, 1000);
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
                streak = 0;
                setTimeout(renderQuestion, 2000);
            }
        }
    </script>
</body>
</html>
