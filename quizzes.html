<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Engine - Unit 4 Hub</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .logo { color: white; font-weight: 800; font-size: 1.2rem; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; opacity: 0.8; }

        .container { max-width: 800px; margin: 40px auto; width: 90%; }

        /* Modern Tab Navigation */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tab-btn { 
            background: white; border: 1px solid #ddd; padding: 10px 20px; 
            border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; 
            transition: 0.3s; color: #666; 
        }
        .tab-btn.active { background: var(--navy); color: white; border-color: var(--navy); box-shadow: 0 4px 12px rgba(10,40,95,0.2); }

        /* Glass Cards */
        .quiz-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 28px; padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center; position: relative;
        }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; text-align: left; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--navy); margin-bottom: 5px; text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; 
            font-family: inherit; font-size: 0.9rem; box-sizing: border-box;
        }

        /* Question Bank List */
        .bank-item {
            background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #eee; text-align: left;
        }
        .bank-info { font-size: 0.75rem; color: #888; font-weight: 700; }
        .bank-q { font-weight: 600; color: var(--navy); margin: 5px 0; }

        /* Quiz UI Elements */
        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 10px; margin-bottom: 30px; }
        #progressFill { width: 0%; height: 100%; background: var(--gold); border-radius: 10px; transition: 0.5s; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn {
            background: white; border: 2px solid #f0f0f0; padding: 15px; border-radius: 12px;
            cursor: pointer; font-size: 1rem; transition: 0.2s;
        }
        .option-btn.correct { background: var(--green) !important; color: white; border-color: var(--green); }
        .option-btn.wrong { background: var(--red) !important; color: white; border-color: var(--red); animation: shake 0.4s; }

        .btn-main { background: var(--navy); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-del { background: none; border: none; color: var(--red); cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .hidden { display: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">We The People</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="team.html">Team</a>
            <a href="practice.html">Practice</a>
            <a href="evidence.html">Charts</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="quizzes.html">Quizzes</a>
        </nav>
    </header>

    <div class="container">
        <div class="tabs">
            <button id="tab-play" class="tab-btn active" onclick="switchTab('play')">Take Quiz</button>
            <button id="tab-arch" class="tab-btn" onclick="switchTab('arch')">Architect</button>
            <button id="tab-bank" class="tab-btn" onclick="switchTab('bank')">Question Bank</button>
        </div>

        <div id="view-play" class="quiz-card">
            <h2 style="color: var(--navy); margin:0 0 20px 0;">Quiz Engine</h2>
            <div class="input-row">
                <div class="input-group">
                    <label>Member</label>
                    <select id="playMember">
                        <option value="Global">All Members</option>
                        <option value="Luna">Luna</option>
                        <option value="Sarah">Sarah</option>
                        <option value="Bekim">Bekim</option>
                        <option value="Evan">Evan</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Topic</label>
                    <select id="playTopic">
                        <option value="All">All Questions</option>
                        <option value="Q1">Question 1</option>
                        <option value="Q2">Question 2</option>
                        <option value="Q3">Question 3</option>
                    </select>
                </div>
            </div>
            <button class="btn-main" onclick="startQuiz()">Launch Engine</button>
        </div>

        <div id="view-arch" class="quiz-card hidden">
            <h2 style="color: var(--navy); margin: 0 0 10px 0;">Question Architect</h2>
            <div class="input-row">
                <div class="input-group">
                    <label>Assign To</label>
                    <select id="archMember">
                        <option value="Luna">Luna</option>
                        <option value="Sarah">Sarah</option>
                        <option value="Bekim">Bekim</option>
                        <option value="Evan">Evan</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Question Type</label>
                    <select id="archTopic">
                        <option value="Q1">Question 1</option>
                        <option value="Q2">Question 2</option>
                        <option value="Q3">Question 3</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>Question</label>
                <input type="text" id="archQ" placeholder="Enter constitutional question...">
            </div>
            <div class="input-group">
                <label>Correct Answer</label>
                <input type="text" id="archCA" placeholder="The right answer...">
            </div>
            <div class="input-group">
                <label>Distractors (Comma Separated)</label>
                <input type="text" id="archWA" placeholder="Wrong 1, Wrong 2, Wrong 3">
            </div>
            <button class="btn-main" style="background:var(--gold)" onclick="saveToBank()">Add to Bank</button>
        </div>

        <div id="view-bank" class="quiz-card hidden">
            <h2 style="color: var(--navy); margin: 0 0 20px 0;">Management Console</h2>
            <div id="bankList"></div>
        </div>

        <div id="view-active" class="quiz-card hidden">
            <div class="progress-bar"><div id="progressFill"></div></div>
            <div id="qText" class="question-text"></div>
            <div id="options" class="options-grid"></div>
            <button id="nextBtn" class="btn-main hidden" style="margin-top:20px" onclick="nextQuestion()">Next &rarr;</button>
        </div>
    </div>

    <script>
        let quizPool = [];
        let currentIdx = 0;
        let score = 0;

        function switchTab(tab) {
            ['play', 'arch', 'bank'].forEach(t => {
                document.getElementById('view-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('active');
            });
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('view-active').classList.add('hidden');
            if(tab === 'bank') renderBank();
        }

        function saveToBank() {
            const q = {
                id: Date.now(),
                member: document.getElementById('archMember').value,
                topic: document.getElementById('archTopic').value,
                front: document.getElementById('archQ').value,
                back: document.getElementById('archCA').value,
                distractors: document.getElementById('archWA').value.split(',').map(s => s.trim())
            };
            if(!q.front || !q.back) return alert("Please fill in the Question and Correct Answer.");
            
            const bank = JSON.parse(localStorage.getItem('wtp_bank')) || [];
            bank.push(q);
            localStorage.setItem('wtp_bank', JSON.stringify(bank));
            
            // Clear inputs
            ['archQ', 'archCA', 'archWA'].forEach(id => document.getElementById(id).value = '');
            alert("Question added to " + q.member + "'s " + q.topic + " bank!");
        }

        function renderBank() {
            const bank = JSON.parse(localStorage.getItem('wtp_bank')) || [];
            const container = document.getElementById('bankList');
            container.innerHTML = bank.length ? '' : '<p>No custom questions yet.</p>';
            
            bank.forEach(q => {
                const item = document.createElement('div');
                item.className = 'bank-item';
                item.innerHTML = `
                    <div>
                        <div class="bank-info">${q.member.toUpperCase()} • ${q.topic}</div>
                        <div class="bank-q">${q.front}</div>
                    </div>
                    <button class="btn-del" onclick="deleteBankItem(${q.id})">DELETE</button>
                `;
                container.appendChild(item);
            });
        }

        function deleteBankItem(id) {
            let bank = JSON.parse(localStorage.getItem('wtp_bank')) || [];
            bank = bank.filter(q => q.id !== id);
            localStorage.setItem('wtp_bank', JSON.stringify(bank));
            renderBank();
        }

        function startQuiz() {
            const selMember = document.getElementById('playMember').value;
            const selTopic = document.getElementById('playTopic').value;
            
            // 1. Get Base Flashcards
            let pool = [];
            const members = selMember === 'Global' ? ['Luna', 'Sarah', 'Bekim', 'Evan'] : [selMember];
            const topics = selTopic === 'All' ? ['Q1', 'Q2', 'Q3'] : [selTopic];

            members.forEach(m => {
                topics.forEach(t => {
                    const cards = JSON.parse(localStorage.getItem(`cards_${m}_${t}`)) || [];
                    pool = [...pool, ...cards];
                });
            });

            // 2. Get Custom Architect Questions
            const bank = JSON.parse(localStorage.getItem('wtp_bank')) || [];
            const filteredBank = bank.filter(q => 
                (selMember === 'Global' || q.member === selMember) && 
                (selTopic === 'All' || q.topic === selTopic)
            );

            quizPool = [...pool, ...filteredBank].sort(() => 0.5 - Math.random());
            if(!quizPool.length) return alert("No questions found for this selection!");

            currentIdx = 0; score = 0;
            document.getElementById('view-play').classList.add('hidden');
            document.getElementById('view-active').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = quizPool[currentIdx];
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('qText').innerText = q.front;
            document.getElementById('progressFill').style.width = `${(currentIdx / quizPool.length) * 100}%`;

            const grid = document.getElementById('options');
            grid.innerHTML = '';
            
            let answers = [q.back];
            let distractors = q.distractors ? q.distractors : quizPool.filter(item => item.back !== q.back).map(item => item.back);
            distractors = distractors.filter(d => d).sort(() => 0.5 - Math.random()).slice(0, 3);
            
            [...answers, ...distractors].sort(() => 0.5 - Math.random()).forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = text;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    if(text === q.back) { btn.classList.add('correct'); score++; }
                    else { 
                        btn.classList.add('wrong'); 
                        document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.back) b.classList.add('correct'); });
                    }
                    document.getElementById('nextBtn').classList.remove('hidden');
                };
                grid.appendChild(btn);
            });
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < quizPool.length) showQuestion();
            else {
                document.getElementById('view-active').innerHTML = `
                    <h2 style="color:var(--navy)">Result</h2>
                    <div style="font-size:3rem; color:var(--gold); font-weight:800;">${Math.round(score/quizPool.length*100)}%</div>
                    <p>Correct: ${score} / ${quizPool.length}</p>
                    <button class="btn-main" onclick="location.reload()">Back to Dashboard</button>
                `;
            }
        }
    </script>
</body>
</html>
