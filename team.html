<div id="main-team-view" class="container">
    <h1 style="text-align:center; color:var(--navy); margin: 40px 0;">Team Members</h1>
    <div class="team-grid" style="display: flex; justify-content: space-around; gap: 20px;">
        <div class="member-card" onclick="openLocker('Luna', '🦭')">
            <div class="emoji-display">🦭</div>
            <h3>Luna</h3>
        </div>
        </div>
</div>

<div id="member-locker" class="hidden" style="display:none; padding: 40px 5%;">
    <button class="back-btn" onclick="closeLocker()">← BACK TO TEAM</button>
    
    <div class="locker-header">
        <span id="locker-emoji" style="font-size: 5rem;"></span>
        <h1 id="locker-name" style="color:var(--navy); margin: 10px 0;"></h1>
        <div class="xp-shelf">
            <div class="level-badge" id="locker-level">LEVEL 1 INITIATE</div>
            <div class="xp-bar-bg"><div id="xp-fill" class="xp-bar-fill"></div></div>
        </div>
    </div>

    <div class="badge-grid" id="badge-case">
        </div>
</div>

<style>
    /* Match your screenshot's style */
    .member-card {
        border: 2px solid var(--gold);
        border-radius: 20px;
        padding: 40px;
        width: 180px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.3s;
        background: white;
    }
    .member-card:hover { transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .emoji-display { font-size: 3rem; margin-bottom: 15px; }
    
    /* Locker Specifics */
    .xp-bar-bg { width: 100%; height: 12px; background: #eee; border-radius: 6px; margin-top: 10px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: var(--gold); width: 0%; transition: 1s; }
    
    .badge-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        margin-top: 40px;
        background: rgba(255,255,255,0.5);
        padding: 30px;
        border-radius: 30px;
    }
    .badge-slot {
        aspect-ratio: 1;
        background: white;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        border: 1px solid #ddd;
        position: relative;
    }
    .badge-slot.locked { opacity: 0.3; filter: grayscale(1); }
    .badge-name { font-size: 0.6rem; font-weight: 800; margin-top: 5px; text-transform: uppercase; }
</style>

<script>
    const badgeList = [
        { name: "The Framer", icon: "📜" }, { name: "Initiate", icon: "🕯️" },
        { name: "Quick Study", icon: "📖" }, { name: "Collaborator", icon: "🤝" },
        { name: "Night Owl", icon: "🦉" }, { name: "The Federalist", icon: "🖋️" },
        { name: "The Flash", icon: "⚡" }, { name: "Q1 Guru", icon: "🏛️" },
        { name: "Q2 Guru", icon: "⚖️" }, { name: "Q3 Guru", icon: "👨‍⚖️" },
        { name: "Grand Inquisitor", icon: "👑" }, { name: "Ghost Master", icon: "👻" },
        { name: "Centennial", icon: "💯" }, { name: "Unstoppable", icon: "🔥" },
        { name: "The Oracle", icon: "🔮" }
    ];

    function openLocker(name, emoji) {
        document.getElementById('main-team-view').style.display = 'none';
        document.getElementById('member-locker').style.display = 'block';
        document.getElementById('locker-name').innerText = name;
        document.getElementById('locker-emoji').innerText = emoji;
        
        // Load stats
        const stats = JSON.parse(localStorage.getItem(`stats_${name}`)) || { xp: 0, level: 1, badges: [] };
        document.getElementById('locker-level').innerText = `LEVEL ${stats.level} SCHOLAR`;
        document.getElementById('xp-fill').style.width = (stats.xp % 100) + "%";

        // Render Badges
        const grid = document.getElementById('badge-case');
        grid.innerHTML = badgeList.map(b => `
            <div class="badge-slot ${stats.badges.includes(b.name) ? '' : 'locked'}">
                ${stats.badges.includes(b.name) ? b.icon : '🔒'}
                <div class="badge-name">${b.name}</div>
            </div>
        `).join('');
    }

    function closeLocker() {
        document.getElementById('main-team-view').style.display = 'block';
        document.getElementById('member-locker').style.display = 'none';
    }
</script>
