<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Unit 4</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .flashcard-container { padding: 40px; max-width: 800px; margin: auto; text-align: center; }
        
        /* Flashcard Flip Animation */
        .card-wrapper {
            perspective: 1000px;
            width: 300px;
            height: 200px;
            margin: 20px auto;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 2px solid #D4AF37; /* Gold Accent */
        }

        .card-wrapper.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: white;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .card-back {
            background-color: #0A285F; /* Navy */
            color: white;
            transform: rotateY(180deg);
        }

        /* Form styling */
        .card-form { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 40px; border-top: 4px solid #B22234; }
        .card-form input { padding: 10px; margin: 5px; width: 80%; border: 1px solid #ccc; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .delete-btn { background: #B22234; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="evidence.html">Evidence Charts</a></li>
            <li><a href="flashcards.html">Flashcards</a></li>
        </ul>
    </nav>

    <div class="flashcard-container">
        <h2>Flashcards Section</h2>
        
        <div class="card-form">
            <h3>Add New Flashcard</h3>
            <input type="text" id="frontInput" placeholder="Front (Term/Question)">
            <input type="text" id="backInput" placeholder="Back (Definition/Answer)">
            <br>
            <button class="btn" onclick="createNewCard()">Add Card</button>
        </div>

        <div id="flashcardGrid" class="grid">
            </div>
    </div>

    <script>
        const grid = document.getElementById('flashcardGrid');

        window.onload = loadCards;

        function createNewCard() {
            const front = document.getElementById('frontInput').value;
            const back = document.getElementById('backInput').value;
            if(!front || !back) return alert("Fill both sides!");

            const cards = JSON.parse(localStorage.getItem('unit4Cards')) || [];
            cards.push({ front, back, id: Date.now() });
            localStorage.setItem('unit4Cards', JSON.stringify(cards));
            
            document.getElementById('frontInput').value = '';
            document.getElementById('backInput').value = '';
            loadCards();
        }

        function loadCards() {
            grid.innerHTML = '';
            const cards = JSON.parse(localStorage.getItem('unit4Cards')) || [];
            cards.forEach(card => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="card-wrapper" onclick="this.classList.toggle('is-flipped')">
                        <div class="card-inner">
                            <div class="card-front">${card.front}</div>
                            <div class="card-back">${card.back}</div>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteCard(${card.id})">Delete</button>
                `;
                grid.appendChild(div);
            });
        }

        function deleteCard(id) {
            let cards = JSON.parse(localStorage.getItem('unit4Cards'));
            cards = cards.filter(c => c.id !== id);
            localStorage.setItem('unit4Cards', JSON.stringify(cards));
            loadCards();
        }
    </script>
</body>
</html>
