<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Charts - Unit 4</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific Styles for the Table */
        .chart-container { padding: 40px; max-width: 1200px; margin: auto; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            border: 2px solid #D4AF37; /* Gold Accent [cite: 2] */
        }

        th { 
            background-color: #0A285F; /* Navy [cite: 2] */
            color: white; 
            padding: 12px; 
            text-align: left; 
        }

        td { 
            border: 1px solid #ddd; 
            padding: 10px; 
        }

        textarea { 
            width: 100%; 
            border: none; 
            resize: vertical; 
            font-family: inherit; 
            font-size: 1rem;
        }

        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="evidence.html">Evidence Charts</a></li>
            </ul>
    </nav>

    <div class="chart-container">
        <h2>Evidence Chart Template</h2>
        <p>Enter your evidence below. Changes are saved automatically to your browser.</p>

        <div class="controls">
            <button class="btn" onclick="addRow()">+ Add Row</button>
            <button class="btn" style="background-color: #0A285F;" onclick="saveData()">Manual Save</button>
        </div>

        <table id="evidenceTable">
            <thead>
                <tr>
                    <th>Evidence </th>
                    <th>Constitutional / Historical Connection </th>
                    <th>Why it relates to Q1/Q3 </th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        const tableBody = document.getElementById('tableBody');

        // Load data on page start
        window.onload = () => {
            const savedData = JSON.parse(localStorage.getItem('unit4Evidence')) || [];
            if (savedData.length === 0) {
                for(let i=0; i<3; i++) addRow(); // Start with 3 empty rows 
            } else {
                savedData.forEach(data => addRow(data.col1, data.col2, data.col3));
            }
        };

        function addRow(val1 = '', val2 = '', val3 = '') {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><textarea oninput="autoSave()">${val1}</textarea></td>
                <td><textarea oninput="autoSave()">${val2}</textarea></td>
                <td><textarea oninput="autoSave()">${val3}</textarea></td>
                <td><button onclick="this.parentElement.parentElement.remove(); autoSave();">×</button></td>
            `;
            tableBody.appendChild(row);
        }

        function autoSave() {
            const rows = document.querySelectorAll('#tableBody tr');
            const data = Array.from(rows).map(row => {
                const texts = row.querySelectorAll('textarea');
                return { col1: texts[0].value, col2: texts[1].value, col3: texts[2].value };
            });
            localStorage.setItem('unit4Evidence', JSON.stringify(data));
        }
        
        function saveData() {
            autoSave();
            alert("Data saved to browser storage!");
        }
    </script>
</body>
</html>
