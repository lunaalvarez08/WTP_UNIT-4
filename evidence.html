<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Evidence Charts - Unit 4</title>
    <style>
        /* This matches the look from your screenshot */
        body { margin: 0; font-family: 'Times New Roman', serif; background-color: #FFFFFF; }
        
        header { 
            background-color: #0A285F; 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo { color: white; font-weight: bold; font-size: 1.5rem; }
        
        nav a { 
            color: white; 
            text-decoration: none; 
            margin-left: 20px; 
            font-size: 0.9rem; 
            font-family: sans-serif; /* Nav usually looks better in sans-serif */
        }

        .content-container { padding: 50px 5%; }
        h2 { color: #0A285F; text-align: center; font-size: 2.5rem; margin-bottom: 10px; }
        
        .add-btn { 
            border: 2px solid #D4AF37; 
            background: white; 
            color: #0A285F; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: bold;
            display: block;
            margin: 0 auto 30px auto;
        }

        table { width: 100%; border-collapse: collapse; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        th { background-color: #0A285F; color: white; padding: 15px; border: 1px solid #0A285F; }
        td { border: 1px solid #ddd; padding: 0; }
        
        textarea { 
            width: 100%; border: none; padding: 15px; min-height: 80px; 
            display: block; resize: vertical; box-sizing: border-box; font-family: inherit;
        }

        .delete-btn { color: #B22234; background: none; border: none; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">We The People</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="team.html">Team Members</a>
            <a href="practice.html">Practice Sets</a>
            <a href="evidence.html">Evidence Charts</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="quizzes.html">Quizzes</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <div class="content-container">
        <h2>Evidence Chart</h2>
        <p style="text-align: center; color: #666; margin-bottom: 40px;">Default 3x10 template. Data saves automatically to this device.</p>

        <button class="add-btn" onclick="addRow()">+ Add Row</button>

        <table id="evidenceTable">
            <thead>
                <tr>
                    <th>Evidence </th>
                    <th>Constitutional / Historical Connection </th>
                    <th>Why it relates to Q1/Q3 </th>
                    <th style="width: 50px; background: white; border: none;"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        const tableBody = document.getElementById('tableBody');

        // Initialize Page
        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('unit4Evidence')) || [];
            if (saved.length === 0) {
                for(let i=0; i<10; i++) addRow(); // Requirement: Default 10 rows 
            } else {
                saved.forEach(data => addRow(data.c1, data.c2, data.c3));
            }
        };

        function addRow(v1='', v2='', v3='') {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><textarea oninput="save()">${v1}</textarea></td>
                <td><textarea oninput="save()">${v2}</textarea></td>
                <td><textarea oninput="save()">${v3}</textarea></td>
                <td style="text-align:center;"><button class="delete-btn" onclick="this.parentElement.parentElement.remove(); save();">&times;</button></td>
            `;
            tableBody.appendChild(tr);
        }

        function save() {
            const rows = document.querySelectorAll('#tableBody tr');
            const data = Array.from(rows).map(r => {
                const t = r.querySelectorAll('textarea');
                return { c1: t[0].value, c2: t[1].value, c3: t[2].value };
            });
            localStorage.setItem('unit4Evidence', JSON.stringify(data));
        }
    </script>
</body>
</html>
