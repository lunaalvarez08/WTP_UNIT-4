<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice Hub - Master Edition</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; overflow-x: hidden;
        }

        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; z-index: 100; }
        .logo { color: white; font-weight: 800; font-size: 1.2rem; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; opacity: 0.8; }

        .container { max-width: 900px; margin: 30px auto; width: 90%; }

        .settings-bar {
            background: var(--navy); color: white; padding: 20px;
            border-radius: 20px; display: flex; gap: 15px; align-items: flex-end;
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(10,40,95,0.2);
        }
        .settings-group { flex: 1; }
        .settings-group label { display: block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; color: var(--gold); }
        
        select, input, textarea { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: white; padding: 10px; border-radius: 8px; width: 100%; font-weight: 600; font-family: inherit;
        }
        select option { color: black; }

        /* Vault Tabs */
        .vault-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .v-tab { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #eee; transition: 0.3s; }
        .v-tab.active { background: var(--navy); color: white; }

        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .game-card {
            background: var(--glass); border-radius: 24px; padding: 25px;
            text-align: center; cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .game-card:hover { transform: translateY(-8px); border-color: var(--gold); }
        .game-icon { font-size: 2.5rem; margin-bottom: 10px; }

        .vault-card { background: white; padding: 30px; border-radius: 24px; margin-top: 20px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .vault-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; color: #333; }

        #game-arena { display: none; background: white; border-radius: 30px; padding: 30px; min-height: 550px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .back-btn { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }

        /* TETRIS UI */
        #tetris-container { height: 420px; border: 5px solid var(--navy); border-radius: 15px; position: relative; background: #0a0a0a; overflow: hidden; }
        .tetris-piece { position: absolute; background: var(--gold); color: black; padding: 8px 12px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; box-shadow: 0 4px 0 #b38f1d; }
        .tetris-bucket { position: absolute; bottom: 0; height: 90px; width: 33.3%; border-top: 4px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 0.75rem; text-align: center; background: linear-gradient(to bottom, #1a1a1a, #000); transition: 0.2s; }
        .bucket-flash { background: var(--green) !important; }

        /* MATCH UI */
        .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .card { height: 110px; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-size: 0.75rem; text-align: center; padding: 8px; transition: 0.3s; font-weight: 600; }
        .card.flipped { background: var(--gold); color: black; }
        .card.matched { opacity: 0; pointer-events: none; }

        /* GHOST UI */
        .ghost-display { font-size: 1.25rem; line-height: 1.8; color: #2c3e50; height: 350px; overflow-y: auto; padding: 25px; border: 2px solid #edf2f7; border-radius: 20px; background: #f8fafc; }
        .ghost-blur { background: #cbd5e0; color: #cbd5e0; border-radius: 4px; padding: 0 4px; transition: 0.3s; cursor: pointer; }
        .ghost-blur:hover { color: #2c3e50; background: #e2e8f0; }

        .hidden { display: none; }
        .btn-main { background: var(--navy); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">We The People</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="practice.html">Practice</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="quizzes.html">Quizzes</a>
        </nav>
    </header>

    <div class="container">
        <div class="settings-bar">
            <div class="settings-group">
                <label>Team Member</label>
                <select id="globalMember" onchange="renderVault()">
                    <option value="Global">Full Team</option>
                    <option value="Luna">Luna</option>
                    <option value="Sarah">Sarah</option>
                    <option value="Bekim">Bekim</option>
                    <option value="Evan">Evan</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Unit Filter</label>
                <select id="globalTopic" onchange="renderVault()">
                    <option value="All">Complete Unit 4</option>
                    <option value="Q1">Q1: Foundations</option>
                    <option value="Q2">Q2: Structures</option>
                    <option value="Q3">Q3: Application</option>
                </select>
            </div>
            <button class="btn-main" onclick="toggleVault()" style="background:var(--gold); color: black;">Edit Vault</button>
        </div>

        <div id="vault-section" class="vault-card">
            <h3 style="color:var(--navy); margin-top:0;">🗄️ Game-Specific Vault</h3>
            
            <div class="vault-tabs">
                <button class="v-tab active" id="tab-tetris" onclick="switchVaultTab('tetris')">Tetris Data</button>
                <button class="v-tab" id="tab-match" onclick="switchVaultTab('match')">Match Pairs</button>
                <button class="v-tab" id="tab-ghost" onclick="switchVaultTab('ghost')">Scripts</button>
            </div>

            <div style="background:#f8fafc; padding: 20px; border-radius: 15px; margin-bottom: 20px;">
                <div id="vault-inputs" style="display:flex; gap:10px; margin-bottom:10px; flex-direction: column;">
                    <input type="text" id="vInput1" placeholder="Label (e.g. Article II)" style="color:black; border:2px solid #ddd">
                    <textarea id="vInput2" placeholder="Content (e.g. Veto Power or full script)" style="color:black; border:2px solid #ddd; height: 80px;"></textarea>
                </div>
                <button class="btn-main" onclick="saveToVault()" style="width:100%">Save to Selected Game</button>
            </div>
            <div id="vault-list"></div>
        </div>

        <div id="lobby-view">
            <div class="game-grid">
                <div class="game-card" onclick="launchGame('tetris')">
                    <div class="game-icon">🧱</div>
                    <h3>Civics Tetris</h3>
                    <p>High-speed sorting.</p>
                </div>
                <div class="game-card" onclick="launchGame('match')">
                    <div class="game-icon">🃏</div>
                    <h3>Flash-Match</h3>
                    <p>Principle to Evidence visual memory.</p>
                </div>
                <div class="game-card" onclick="launchGame('ghost')">
                    <div class="game-icon">👻</div>
                    <h3>Ghost Writer</h3>
                    <p>Recall your opening script.</p>
                </div>
            </div>
        </div>

        <div id="game-arena">
            <button class="back-btn" onclick="exitGame()">EXIT TO LOBBY</button>
            <div id="game-stage"></div>
        </div>
    </div>

    <script>
        let tScore = 0, tStreak = 0, activeGameInterval;
        let currentVaultTab = 'tetris';

        function toggleVault() {
            const v = document.getElementById('vault-section');
            v.style.display = v.style.display === 'block' ? 'none' : 'block';
            renderVault();
        }

        function switchVaultTab(tab) {
            currentVaultTab = tab;
            document.querySelectorAll('.v-tab').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            // Adjust placeholders for clarity
            const in1 = document.getElementById('vInput1');
            const in2 = document.getElementById('vInput2');
            if(tab === 'tetris') { in1.placeholder = "Bucket Name (e.g. Article I)"; in2.placeholder = "Item (e.g. Commerce Clause)"; }
            if(tab === 'match') { in1.placeholder = "Card A (e.g. Fed 10)"; in2.placeholder = "Card B (e.g. Factions)"; }
            if(tab === 'ghost') { in1.placeholder = "Script Title"; in2.placeholder = "Full Text Content"; }
            
            renderVault();
        }

        function saveToVault() {
            const a = document.getElementById('vInput1').value;
            const b = document.getElementById('vInput2').value;
            if(!a || !b) return alert("Fill both fields!");
            
            const data = {
                id: Date.now(),
                gameType: currentVaultModeTag(), 
                member: document.getElementById('globalMember').value,
                topic: document.getElementById('globalTopic').value, 
                a, b
            };
            
            const vault = JSON.parse(localStorage.getItem('game_vault_v2')) || [];
            vault.push(data);
            localStorage.setItem('game_vault_v2', JSON.stringify(vault));
            document.getElementById('vInput1').value = ''; 
            document.getElementById('vInput2').value = '';
            renderVault();
        }

        function currentVaultModeTag() { return currentVaultTab; }

        function renderVault() {
            const vault = JSON.parse(localStorage.getItem('game_vault_v2')) || [];
            const member = document.getElementById('globalMember').value;
            const topic = document.getElementById('globalTopic').value;
            
            const filtered = vault.filter(i => 
                i.gameType === currentVaultTab &&
                (member === 'Global' || i.member === member) &&
                (topic === 'All' || i.topic === topic)
            );

            document.getElementById('vault-list').innerHTML = filtered.length ? filtered.map(i => `
                <div class="vault-item">
                    <span><b>[${i.topic}]</b> ${i.a} ➔ ${i.b.substring(0,25)}...</span>
                    <button onclick="deleteVault(${i.id})" style="color:var(--red); border:none; background:none; cursor:pointer; font-weight:bold;">X</button>
                </div>
            `).join('') : '<p style="text-align:center; color:#999; font-size:0.8rem;">No data for this specific game/member/topic.</p>';
        }

        function deleteVault(id) {
            let vault = JSON.parse(localStorage.getItem('game_vault_v2')) || [];
            localStorage.setItem('game_vault_v2', JSON.stringify(vault.filter(i => i.id !== id)));
            renderVault();
        }

        function launchGame(type) {
            const member = document.getElementById('globalMember').value;
            const topic = document.getElementById('globalTopic').value;
            const vault = JSON.parse(localStorage.getItem('game_vault_v2')) || [];
            
            // FILTER BY GAME TYPE, MEMBER, AND TOPIC
            const pool = vault.filter(i => 
                i.gameType === type &&
                (member === 'Global' || i.member === member) && 
                (topic === 'All' || i.topic === topic)
            );

            if (pool.length < 1) return alert(`No ${type} data found for ${member} in ${topic}! Add some in the Vault first.`);

            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('game-arena').style.display = 'block';
            const stage = document.getElementById('game-stage');

            if (type === 'match') runMatch(pool, stage);
            if (type === 'tetris') runTetris(pool, stage);
            if (type === 'ghost') runGhost(pool, stage);
        }

        function exitGame() {
            clearInterval(activeGameInterval);
            location.reload();
        }

        function runTetris(data, stage) {
            const buckets = [...new Set(data.map(i => i.a))].slice(0, 3);
            if(buckets.length < 2) return stage.innerHTML = "Need at least 2 different Buckets!";
            tScore = 0; tStreak = 0;
            stage.innerHTML = `<div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:800; color:var(--navy)">
                <div>SCORE: <span id="t-score">0</span></div><div id="t-streak" style="color:var(--gold)">STREAK: 0x</div>
            </div><div id="tetris-container">${buckets.map((b, i) => `<div class="tetris-bucket" style="left:${i*33.3}%" id="bkt-${i}">${b}</div>`).join('')}</div>`;
            
            const container = document.getElementById('tetris-container');
            activeGameInterval = setInterval(() => {
                const item = data[Math.floor(Math.random()*data.length)];
                const piece = document.createElement('div');
                piece.className = 'tetris-piece'; piece.innerText = item.b.substring(0, 35);
                piece.style.left = Math.random() * 65 + '%';
                container.appendChild(piece);
                let pos = 0, speed = 2.5 + (tScore / 2500);
                const fall = setInterval(() => {
                    pos += speed; piece.style.top = pos + 'px';
                    if (pos > 330) {
                        clearInterval(fall);
                        const bktIdx = Math.floor((piece.offsetLeft + 20) / (container.offsetWidth / 3));
                        if (buckets[bktIdx] === item.a) {
                            tScore += 100 * (tStreak + 1); tStreak++;
                            document.getElementById(`bkt-${bktIdx}`).classList.add('bucket-flash');
                            setTimeout(() => document.getElementById(`bkt-${bktIdx}`).classList.remove('bucket-flash'), 200);
                        } else { tStreak = 0; piece.style.animation = "shake 0.3s"; }
                        document.getElementById('t-score').innerText = tScore;
                        document.getElementById('t-streak').innerText = `STREAK: ${tStreak}x`;
                        setTimeout(() => piece.remove(), 300);
                    }
                }, 30);
            }, 3000);
        }

        function runMatch(data, stage) {
            stage.innerHTML = `<div class="match-grid" id="mGrid"></div>`;
            let cards = [], selected = [];
            data.forEach(i => { cards.push({t: i.a, p: i.id}, {t: i.b, p: i.id}); });
            cards.sort(() => 0.5 - Math.random()).forEach(c => {
                const el = document.createElement('div'); el.className = 'card'; el.innerText = '??';
                el.onclick = () => {
                    if(selected.length < 2 && !el.classList.contains('flipped')) {
                        el.classList.add('flipped'); el.innerText = c.t; selected.push({el, p: c.p});
                        if(selected.length === 2) {
                            if(selected[0].p === selected[1].p) {
                                setTimeout(() => { selected.forEach(s => s.el.classList.add('matched')); selected = []; }, 600);
                            } else {
                                setTimeout(() => { selected.forEach(s => { s.el.classList.remove('flipped'); s.el.innerText = '??'; }); selected = []; }, 1000);
                            }
                        }
                    }
                };
                document.getElementById('mGrid').appendChild(el);
            });
        }

        function runGhost(data, stage) {
            const script = data[data.length-1].b;
            const ghostHTML = script.split(' ').map(w => Math.random() > 0.8 ? `<span class="ghost-blur" onclick="this.classList.remove('ghost-blur')">${w}</span>` : w).join(' ');
            stage.innerHTML = `<h3>Script Recall</h3><div class="ghost-display">${ghostHTML}</div><p style="color:#666; font-size:0.8rem; margin-top:15px;">Click blurred words to reveal them!</p>`;
        }
    </script>
</body>
</html>
