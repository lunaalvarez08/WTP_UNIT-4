<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <title>Practice Hub | We The People</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .logo { color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; opacity: 0.8; }
        nav a:hover { opacity: 1; color: var(--gold); }

        .container { max-width: 900px; margin: 30px auto; width: 90%; }

        .settings-bar {
            background: var(--navy); color: white; padding: 20px;
            border-radius: 20px; display: flex; gap: 15px; align-items: flex-end;
            margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .settings-group { flex: 1; }
        .settings-group label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; }
        
        select { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: white; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer;
        }

        #lobby-view { display: block; }
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .game-card { 
            background: var(--glass); border-radius: 24px; padding: 30px 15px; 
            text-align: center; cursor: pointer; transition: 0.3s; 
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .game-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .game-card div { font-size: 2.5rem; margin-bottom: 10px; }

        #game-arena { display: none; background: white; border-radius: 30px; padding: 40px; min-height: 500px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .back-btn { background: var(--red); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-bottom: 30px; font-weight: bold; }

        .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 800px; margin: 0 auto; }
        .card { height: 100px; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-size: 0.7rem; padding: 10px; transition: 0.2s; overflow: hidden; border: 1px solid transparent; }
        .card.flipped { background: var(--gold); color: black; font-weight: bold; border-color: var(--navy); }
        .card.matched { visibility: hidden; }

        .sort-well, .verdict-box { background: #f1f5f9; padding: 40px; border-radius: 20px; margin: 20px 0; font-size: 1.3rem; font-weight: bold; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #cbd5e1; }
        .bucket-container { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .bucket { flex: 1; padding: 20px; background: var(--navy); color: white; border-radius: 12px; cursor: pointer; font-weight: bold; border: none; font-size: 0.9rem; }
        .bucket:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <header>
        <div class="logo">We The People | Practice Hub</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="team.html">Team</a>
            <a href="practice.html" style="color:var(--gold)">Practice</a>
        </nav>
    </header>

    <div class="container">
        <div class="settings-bar">
            <div class="settings-group">
                <label>Active Study Unit</label>
                <select id="globalTopic" onchange="resetLobby()">
                    <option value="Q1">Q1: Separation of Powers & Administrative State</option>
                </select>
            </div>
            <div style="color:var(--gold); font-size: 0.7rem; font-weight: bold; text-align: right;">VERIFIED FOR <br> NATIONALS 2026</div>
        </div>

        <div id="lobby-view">
            <div class="game-grid">
                <div class="game-card" onclick="launchGame('match')"><div>🃏</div><h3>Evidence Match</h3><p style="font-size:0.7rem;">Pair Cases & Principles</p></div>
                <div class="game-card" onclick="launchGame('sort')"><div>⚖️</div><h3>Article Sorter</h3><p style="font-size:0.7rem;">Article I, II, or III?</p></div>
                <div class="game-card" onclick="launchGame('verdict')"><div>🚨</div><h3>Fact Verdict</h3><p style="font-size:0.7rem;">Instant Recognition</p></div>
            </div>
        </div>

        <div id="game-arena">
            <button class="back-btn" onclick="exitGame()">← EXIT TO LOBBY</button>
            <div id="game-stage"></div>
        </div>
    </div>

    <script>
        const database = {
            "Q1": {
                match: [
                    {t: "Federalist 70", d: "Hamilton argues that a single executive ensures accountability and 'energy'"},
                    {t: "Marbury v Madison", d: "The Court claimed the power to strike down laws that violate the Constitution"},
                    {t: "Hampton v US", d: "Established the 'Intelligible Principle' test for delegation of power"},
                    {t: "Loper Bright 2024", d: "Overruled Chevron; courts must exercise independent judgment on vague laws"},
                    {t: "Humphrey's Executor", d: "Upheld for-cause removal protections for independent agency commissioners"},
                    {t: "Federalist 63", d: "Argues the Senate provides a stable check against temporary public passions"},
                    {t: "Clean Air Act", d: "A prime example of Congress delegating technical rulemaking to an agency"},
                    {t: "West Virginia v EPA", d: "Major Questions Doctrine: Agencies need clear authority for major policies"},
                    {t: "Affordable Care Act", d: "Case study in broad delegation to the Department of Health and Human Services"},
                    {t: "National Emergencies Act", d: "1976 Act requiring formal procedures for the use of emergency powers"},
                    {t: "Federalist 51", d: "Famous for the phrase 'Ambition must be made to counteract ambition'"},
                    {t: "Trade Expansion Act", d: "Sect. 232 allows the President to adjust imports for 'National Security'"},
                    {t: "Article II Vesting", d: "Grants 'The Executive Power' to a single President, sparking Unitary debate"},
                    {t: "Gundy v United States", d: "2019 case where SCOTUS declined to revive the Non-Delegation Doctrine"},
                    {t: "Federal Reserve Board", d: "Independent body controlling monetary policy without political oversight"},
                    {t: "Rules Enabling Act", d: "Congress delegated procedural rulemaking power to the Supreme Court"},
                    {t: "Federalist 78", d: "Judiciary is 'least dangerous' because it lacks both 'sword' and 'purse'"},
                    {t: "United States v Nixon", d: "Executive privilege is not absolute during criminal investigations"},
                    {t: "INS v Chadha", d: "Struck down the Legislative Veto for violating the Presentment Clause"},
                    {t: "Granholm v Heald", d: "Dormant Commerce Clause prevents states from favoring local businesses"},
                    {t: "Mistretta v US", d: "Upheld the Sentencing Commission as a valid use of delegated authority"},
                    {t: "Article III", d: "Vests the 'Judicial Power' and limits original jurisdiction categories"},
                    {t: "2002 Iraq AUMF", d: "Example of broad delegation of the war power to the Executive Branch"},
                    {t: "Bully Pulpit", d: "The President's informal power to use public media to drive policy"},
                    {t: "War Powers Resolution", d: "1973 attempt by Congress to limit unilateral presidential troop use"},
                    {t: "USA PATRIOT Act", d: "Broadly delegated surveillance and intelligence authority to the Executive"},
                    {t: "Federalist 62", d: "Madison argues Senate stability prevents 'mutable' and inconsistent law"},
                    {t: "Plaut v Spendthrift Farm", d: "Separation of Powers: Congress cannot force the reopening of court cases"},
                    {t: "Hayburn's Case", d: "Found that courts cannot be used for purely administrative functions"},
                    {t: "Necessary & Proper Clause", d: "The Article I source of Congress's implied and delegated powers"},
                    {t: "OSHA Act of 1970", d: "Delegated workplace safety regulation to the Department of Labor"},
                    {t: "Internal Revenue Service", d: "Agency authorized to interpret and enforce the federal tax code"},
                    {t: "Federalist 48", d: "Warns that the legislature is the 'impetuous vortex' of power"},
                    {t: "Jarkesy v SEC (2024)", d: "Agencies cannot fine for fraud in-house; the 7th Amendment requires a jury"},
                    {t: "Trump v Slaughter (2025)", d: "Pending challenge to the President's ability to fire FTC commissioners"},
                    {t: "Curtiss-Wright (1936)", d: "Established the President as the 'Sole Organ' in foreign relations"},
                    {t: "Youngstown v Sawyer", d: "Created the three-tier framework for assessing Presidential authority"},
                    {t: "Judicial Activism", d: "The view that courts should use their power to address social issues"},
                    {t: "Originalism", d: "Interpretation based on the meaning of the text at its time of adoption"},
                    {t: "Non-Delegation Doctrine", d: "The theory that Congress cannot give away its core lawmaking power"}
                ],
                sort: [
                    {f: "Granting Reprieves and Pardons", b: "Executive"},
                    {f: "Declaring War", b: "Legislative"},
                    {f: "Interpreting Treaties", b: "Judicial"},
                    {f: "Receiving Ambassadors", b: "Executive"},
                    {f: "Establishing Post Offices", b: "Legislative"},
                    {f: "Settling disputes between States", b: "Judicial"},
                    {f: "Coining Money", b: "Legislative"},
                    {f: "Acting as Commander in Chief", b: "Executive"},
                    {f: "Originating Revenue Bills", b: "Legislative"},
                    {f: "Issuing Writs of Mandamus", b: "Judicial"},
                    {f: "Nominating Federal Judges", b: "Executive"},
                    {f: "Advice and Consent for Treaties", b: "Legislative"},
                    {f: "Adjudicating 'Cases and Controversies'", b: "Judicial"},
                    {f: "Calling forth the Militia", b: "Legislative"},
                    {f: "Commissioning Officers of the US", b: "Executive"},
                    {f: "Granting Letters of Marque", b: "Legislative"},
                    {f: "Deciding cases of Admiralty", b: "Judicial"},
                    {f: "State of the Union Information", b: "Executive"},
                    {f: "Impeachment of Civil Officers", b: "Legislative"},
                    {f: "Punishing Piracies on High Seas", b: "Legislative"},
                    {f: "Executing the Laws", b: "Executive"},
                    {f: "Reviewing constitutionality of laws", b: "Judicial"},
                    {f: "Regulating Foreign Commerce", b: "Legislative"},
                    {f: "Requiring Opinions of Dept Heads", b: "Executive"},
                    {f: "Defining and Punishing Offenses", b: "Legislative"},
                    {f: "Presiding over Impeachment Trials", b: "Judicial"},
                    {f: "Vetoing Congressional Legislation", b: "Executive"},
                    {f: "Appropriating Public Funds", b: "Legislative"},
                    {f: "Exercising Original Jurisdiction", b: "Judicial"},
                    {f: "Convening Extraordinary Sessions", b: "Executive"}
                ]
            }
        };

        let firstCard = null, lockBoard = false, currentItem = null, score = 0, isTrue = true;

        function launchGame(type) {
            const topic = document.getElementById('globalTopic').value;
            const stage = document.getElementById('game-stage');
            const data = database[topic];
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('game-arena').style.display = 'block';
            stage.innerHTML = "";

            if(type === 'match') {
                stage.innerHTML = `<h2>Evidence Match</h2><div class="match-grid" id="grid"></div>`;
                let cards = [];
                let shuffled = [...data.match].sort(() => 0.5 - Math.random()).slice(0, 8);
                shuffled.forEach((item, i) => { cards.push({txt: item.t, id: i}, {txt: item.d, id: i}); });
                cards.sort(() => 0.5 - Math.random());
                cards.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'card'; card.innerText = '???';
                    card.onclick = () => {
                        if(lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;
                        card.classList.add('flipped'); card.innerText = c.txt;
                        if(!firstCard) { firstCard = {card, id: c.id}; } 
                        else {
                            if(firstCard.id === c.id) { 
                                setTimeout(() => { card.classList.add('matched'); firstCard.card.classList.add('matched'); firstCard = null; }, 400);
                            } else {
                                lockBoard = true;
                                setTimeout(() => { card.classList.remove('flipped'); card.innerText = '???'; firstCard.card.classList.remove('flipped'); firstCard.card.innerText = '???'; firstCard = null; lockBoard = false; }, 1000);
                            }
                        }
                    };
                    document.getElementById('grid').appendChild(card);
                });
            } else if(type === 'sort') {
                stage.innerHTML = `<h2>Article Power Sorter</h2><div class="sort-well" id="sd"></div><div class="bucket-container"><button class="bucket" onclick="checkS('Legislative')">Art. I (Leg)</button><button class="bucket" onclick="checkS('Executive')">Art. II (Exec)</button><button class="bucket" onclick="checkS('Judicial')">Art. III (Jud)</button></div><div id="sc" style="margin-top:15px; font-weight:bold;">Score: 0</div>`;
                score = 0; nextS();
            } else if(type === 'verdict') {
                stage.innerHTML = `<h2>Fact Verdict</h2><div class="verdict-box"><h3 id="vT" style="color:var(--red)"></h3><p id="vD"></p></div><div class="bucket-container"><button class="bucket" style="background:var(--green)" onclick="checkV(true)">TRUTH</button><button class="bucket" style="background:var(--red)" onclick="checkV(false)">MYTH</button></div><div id="sc" style="margin-top:15px; font-weight:bold;">Streak: 0</div>`;
                score = 0; nextV();
            }
        }

        function nextS() {
            const items = database[document.getElementById('globalTopic').value].sort;
            currentItem = items[Math.floor(Math.random()*items.length)];
            document.getElementById('sd').innerText = currentItem.f;
        }
        function checkS(a) {
            if(a === currentItem.b) { score++; document.getElementById('sc').innerText = "Score: " + score; }
            else { alert("Incorrect. This is an " + currentItem.b + " power."); score = 0; document.getElementById('sc').innerText = "Score: 0"; }
            nextS();
        }

        function nextV() {
            const items = database[document.getElementById('globalTopic').value].match;
            const r = items[Math.floor(Math.random()*items.length)];
            isTrue = Math.random() > 0.5;
            document.getElementById('vT').innerText = r.t;
            if(isTrue) document.getElementById('vD').innerText = r.d;
            else {
                let w = items[Math.floor(Math.random()*items.length)];
                while(w.t === r.t) w = items[Math.floor(Math.random()*items.length)];
                document.getElementById('vD').innerText = w.d;
            }
        }
        function checkV(a) {
            if(a === isTrue) { score++; document.getElementById('sc').innerText = "Streak: " + score; nextV(); }
            else { alert("False! Your streak has reset."); score = 0; document.getElementById('sc').innerText = "Streak: 0"; nextV(); }
        }

        function exitGame() { document.getElementById('lobby-view').style.display = 'block'; document.getElementById('game-arena').style.display = 'none'; }
        function resetLobby() { exitGame(); }
    </script>
</body>
</html>
