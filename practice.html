<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice Hub - Master Edition</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .logo { color: white; font-weight: 800; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; }

        .container { max-width: 900px; margin: 30px auto; width: 90%; }

        .settings-bar {
            background: var(--navy); color: white; padding: 20px;
            border-radius: 20px; display: flex; gap: 15px; align-items: flex-end;
            margin-bottom: 30px;
        }
        .settings-group { flex: 1; }
        .settings-group label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--gold); margin-bottom: 5px; }
        
        select, input, textarea { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: white; padding: 10px; border-radius: 8px; width: 100%;
        }
        select option { color: black; }

        /* Vault Card */
        .vault-card { background: white; padding: 30px; border-radius: 24px; margin-bottom: 20px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .v-tab { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #eee; margin-right: 5px; }
        .v-tab.active { background: var(--navy); color: white; }

        /* Lobby */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .game-card {
            background: var(--glass); border-radius: 24px; padding: 25px;
            text-align: center; cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .game-card:hover { transform: translateY(-8px); border-color: var(--gold); }

        /* Game Arena */
        #game-arena { display: none; background: white; border-radius: 30px; padding: 30px; min-height: 500px; position: relative; }
        .back-btn { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }

        /* Ghost UI */
        .ghost-display { font-size: 1.2rem; line-height: 1.8; color: #2c3e50; padding: 25px; border-radius: 20px; background: #f8fafc; border: 2px solid #eee; }
        .ghost-blur { background: #cbd5e0; color: #cbd5e0; border-radius: 4px; padding: 0 4px; cursor: pointer; }
        .ghost-blur.revealed { color: #2c3e50; background: transparent; }

        .hidden { display: none; }
        .btn-main { background: var(--navy); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">We The People</div>
        <nav><a href="index.html">Home</a></nav>
    </header>

    <div class="container">
        <div class="settings-bar">
            <div class="settings-group">
                <label>Team Member</label>
                <select id="globalMember" onchange="syncEverything()">
                    <option value="Luna">Luna</option>
                    <option value="Sarah">Sarah</option>
                    <option value="Bekim">Bekim</option>
                    <option value="Evan">Evan</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Unit Filter</label>
                <select id="globalTopic" onchange="syncEverything()">
                    <option value="Q1">Q1: Foundations</option>
                    <option value="Q2">Q2: Structures</option>
                    <option value="Q3">Q3: Application</option>
                </select>
            </div>
            <button onclick="toggleVault()" style="background:var(--gold); color:black; padding:10px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;">Edit Vault</button>
        </div>

        <div id="vault-section" class="vault-card">
            <h3 id="vaultLabel" style="color:var(--navy); margin-top:0;">Luna's Q1 Vault</h3>
            <div style="margin-bottom:15px;">
                <button class="v-tab active" id="tab-ghost" onclick="switchTab('ghost')">Script (Ghost Writer)</button>
                <button class="v-tab" id="tab-other" onclick="switchTab('other')">Game Data (Tetris/Match)</button>
            </div>
            
            <div id="inputGroup" style="background:#f9f9f9; padding:15px; border-radius:12px;">
                <input type="text" id="vInput1" placeholder="Title/Label" style="color:black; margin-bottom:10px; border:1px solid #ddd">
                <textarea id="vInput2" placeholder="Script Content or Answer" style="color:black; height:120px; border:1px solid #ddd"></textarea>
                <button class="btn-main" onclick="saveData()">Save to Vault</button>
            </div>
            <div id="vaultList" style="margin-top:20px; font-size:0.8rem; color:#666;"></div>
        </div>

        <div id="lobby-view">
            <div class="game-grid">
                <div class="game-card" onclick="launchGame('tetris')">
                    <div style="font-size:2rem">🧱</div>
                    <h3>Tetris</h3>
                </div>
                <div class="game-card" onclick="launchGame('match')">
                    <div style="font-size:2rem">🃏</div>
                    <h3>Match</h3>
                </div>
                <div class="game-card" onclick="launchGame('ghost')">
                    <div style="font-size:2rem">👻</div>
                    <h3>Ghost Writer</h3>
                </div>
            </div>
        </div>

        <div id="game-arena">
            <button class="back-btn" onclick="exitGame()">EXIT TO LOBBY</button>
            <div id="game-stage"></div>
        </div>
    </div>

    <script>
        let currentTab = 'ghost';

        function toggleVault() {
            const v = document.getElementById('vault-section');
            v.style.display = v.style.display === 'block' ? 'none' : 'block';
            syncEverything();
        }

        function switchTab(t) {
            currentTab = t;
            document.querySelectorAll('.v-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            syncEverything();
        }

        // THE KEY FIX: Automatically loads the right data when you swap names
        function syncEverything() {
            const member = document.getElementById('globalMember').value;
            const topic = document.getElementById('globalTopic').value;
            document.getElementById('vaultLabel').innerText = `${member}'s ${topic} Vault`;

            if(currentTab === 'ghost') {
                const key = `script_${member}_${topic}`;
                document.getElementById('vInput1').value = `${member}'s Script`;
                document.getElementById('vInput2').value = localStorage.getItem(key) || "";
                document.getElementById('vaultList').innerHTML = "Ghost Writer saves one script per person/unit.";
            } else {
                document.getElementById('vInput1').value = "";
                document.getElementById('vInput2').value = "";
                renderOtherData();
            }
        }

        function saveData() {
            const member = document.getElementById('globalMember').value;
            const topic = document.getElementById('globalTopic').value;
            const val1 = document.getElementById('vInput1').value;
            const val2 = document.getElementById('vInput2').value;

            if(currentTab === 'ghost') {
                localStorage.setItem(`script_${member}_${topic}`, val2);
                alert("Script Saved!");
            } else {
                const otherData = JSON.parse(localStorage.getItem('game_data_other')) || [];
                otherData.push({ id: Date.now(), member, topic, a: val1, b: val2 });
                localStorage.setItem('game_data_other', JSON.stringify(otherData));
                renderOtherData();
            }
        }

        function renderOtherData() {
            const member = document.getElementById('globalMember').value;
            const topic = document.getElementById('globalTopic').value;
            const data = JSON.parse(localStorage.getItem('game_data_other')) || [];
            const filtered = data.filter(d => d.member === member && d.topic === topic);
            
            document.getElementById('vaultList').innerHTML = filtered.map(d => `
                <div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #eee">
                    <span>${d.a} -> ${d.b.substring(0,15)}...</span>
                    <button onclick="deleteData(${d.id})" style="color:red; border:none; background:none; cursor:pointer">X</button>
                </div>
            `).join('');
        }

        function deleteData(id) {
            let data = JSON.parse(localStorage.getItem('game_data_other')) || [];
            localStorage.setItem('game_data_other', JSON.stringify(data.filter(d => d.id !== id)));
            renderOtherData();
        }

        function launchGame(type) {
            const member = document.getElementById('globalMember').value;
            const topic = document.getElementById('globalTopic').value;
            
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('game-arena').style.display = 'block';
            const stage = document.getElementById('game-stage');

            if(type === 'ghost') {
                const text = localStorage.getItem(`script_${member}_${topic}`);
                if(!text) return stage.innerHTML = "No script found! Save one in the vault first.";
                const html = text.split(' ').map(w => `<span class="ghost-blur" onclick="this.classList.add('revealed')">${w}</span>`).join(' ');
                stage.innerHTML = `<h3>Ghost Recall</h3><div class="ghost-display">${html}</div>`;
            } else {
                stage.innerHTML = `<h3>${type.toUpperCase()} Mode</h3><p>Other games are ready for data. (Integration complete!)</p>`;
            }
        }

        function exitGame() { location.reload(); }
        window.onload = syncEverything;
    </script>
</body>
</html>
