<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <title>Practice Hub | We The People</title>
    <style>
        :root {
            --navy: #0A285F; --red: #B22234; --gold: #D4AF37; --green: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        header { background: var(--navy); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .logo { color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.85rem; opacity: 0.8; }
        nav a:hover { opacity: 1; color: var(--gold); }

        .container { max-width: 900px; margin: 30px auto; width: 90%; }

        .settings-bar {
            background: var(--navy); color: white; padding: 20px;
            border-radius: 20px; display: flex; gap: 15px; align-items: flex-end;
            margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .settings-group { flex: 1; }
        .settings-group label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; }
        
        select { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: white; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer;
        }
        select option { color: black; }

        #lobby-view { display: block; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .game-card { 
            background: var(--glass); border-radius: 24px; padding: 40px 25px; 
            text-align: center; cursor: pointer; transition: 0.3s; 
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .game-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .game-card div { font-size: 3rem; margin-bottom: 15px; }

        #game-arena { display: none; background: white; border-radius: 30px; padding: 40px; min-height: 500px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .back-btn { background: var(--red); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-bottom: 30px; font-weight: bold; }

        .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 800px; margin: 0 auto; }
        .card { height: 110px; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-size: 0.75rem; padding: 12px; transition: 0.2s; }
        .card.flipped { background: var(--gold); color: black; font-weight: bold; }
        .card.matched { visibility: hidden; pointer-events: none; }

        .sort-well { background: #f1f5f9; padding: 40px; border-radius: 20px; margin: 20px 0; font-size: 1.4rem; font-weight: bold; min-height: 100px; display: flex; align-items: center; justify-content: center; border: 2px dashed #cbd5e1; }
        .bucket-container { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .bucket { flex: 1; padding: 20px; background: var(--navy); color: white; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .bucket:hover { transform: scale(1.05); background: var(--gold); color: black; }
    </style>
</head>
<body>

    <header>
        <div class="logo">We The People | Practice Hub</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="team.html">Team</a>
            <a href="practice.html" style="color:var(--gold)">Practice</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <div class="container">
        <div class="settings-bar">
            <div class="settings-group">
                <label>Current Mode</label>
                <select id="globalTopic" onchange="resetLobby()">
                    <option value="Q1">Q1: Foundations</option>
                    <option value="Q2">Q2: Structures (Coming Soon)</option>
                    <option value="Q3">Q3: Application (Coming Soon)</option>
                </select>
            </div>
            <div style="color:var(--gold); font-size: 0.7rem; font-weight: bold; text-align: right;">
                NATIONALS PREP <br> 2025 EDITION
            </div>
        </div>

        <div id="lobby-view">
            <div class="game-grid">
                <div class="game-card" onclick="launchGame('match')">
                    <div>🃏</div>
                    <h3>Evidence Match</h3>
                    <p style="font-size:0.75rem; color:#666;">Match cases and papers to their key principles.</p>
                </div>
                <div class="game-card" onclick="launchGame('sort')">
                    <div>⚖️</div>
                    <h3>Branch Sorter</h3>
                    <p style="font-size:0.75rem; color:#666;">Categorize powers by Legislative, Executive, or Judicial.</p>
                </div>
            </div>
        </div>

        <div id="game-arena">
            <button class="back-btn" onclick="exitGame()">← EXIT TO LOBBY</button>
            <div id="game-stage"></div>
        </div>
    </div>

    <script>
        const database = {
            "Q1": {
                match: [
                    {t: "Federalist 70", d: "Hamilton says energy in the executive means one person can act fast"},
                    {t: "Marbury v Madison", d: "Established judicial review so the court is shielded from politics"},
                    {t: "Hampton v US", d: "Created the intelligible principle test for delegating power"},
                    {t: "Loper Bright 2024", d: "Overruled Chevron and said agencies cannot interpret the law"},
                    {t: "Trump v Slaughter 2025", d: "Case about the president firing independent agency members"},
                    {t: "Federalist 63", d: "Senate acts as a stable fence against the whims of the people"},
                    {t: "Clean Air Act", d: "Congress gave the EPA power to control air pollution sources"},
                    {t: "West Virginia v EPA", d: "The court said agencies need clear permission for major questions"},
                    {t: "Affordable Care Act", d: "Shows how agencies handle massive health care regulations"},
                    {t: "National Emergencies Act", d: "Requires presidents to formally declare emergencies to Congress"},
                    {t: "Federalist 51", d: "Ambition must be made to counteract ambition through checks"},
                    {t: "Trade Expansion Act", d: "Section 232 lets the president use tariffs for national security"},
                    {t: "Article II", d: "Vests executive power in a single president for a four year term"},
                    {t: "Gundy v United States", d: "A case where the court kept the nondelegation doctrine weak"},
                    {t: "Federal Reserve Board", d: "Independent body that sets monetary policy for the country"},
                    {t: "Rules Enabling Act", d: "Allows the Supreme Court to make rules for federal courts"},
                    {t: "Federalist 78", d: "The judiciary is the weakest branch because it has no sword or purse"},
                    {t: "United States v Nixon", d: "Confirmed that the president is not above the rule of law"},
                    {t: "INS v Chadha", d: "Ruled that the legislative veto was unconstitutional"},
                    {t: "Granholm v Heald", d: "States cannot stop out of state wine shipments under commerce clause"},
                    {t: "Jacob Ruppert v Caffey", d: "Case about whether contracts can be changed by outside evidence"},
                    {t: "Article III", d: "Establishes the judicial branch and the Supreme Court"},
                    {t: "Gulf of Tonkin", d: "Gave the president power to act in Vietnam without a war declaration"},
                    {t: "Bully Pulpit", d: "The president uses public pressure to influence what Congress does"},
                    {t: "War Powers Resolution", d: "Congress tried to limit the executive ability to deploy troops"},
                    {t: "US Patriot Act", d: "Gave agencies broad surveillance powers after the 911 attacks"},
                    {t: "Federalist 62", d: "Madison explains why the Senate structure checks other branches"},
                    {t: "Plaut v Spendthrift Farm", d: "Congress cannot pass laws that reopen final court decisions"},
                    {t: "Hayburns Case", d: "Early proof that courts cannot be used as administrative bodies"},
                    {t: "Article I Section 8", d: "The necessary and proper clause allows for delegated powers"},
                    {t: "OSHA 1970", d: "Created to handle technical workplace safety standards"},
                    {t: "Internal Revenue Service", d: "Agency delegated with broad powers to enforce tax laws"},
                    {t: "Federalist 48", d: "Madison warns that the legislature is the most dangerous branch"},
                    {t: "FCC v Consumers Research", d: "Agencies cannot use high power without clear authorization"},
                    {t: "Dodd Frank Act", d: "Delegated power to new agencies to regulate the financial markets"},
                    {t: "Iraq 2003 Lapses", d: "Evidence of what happens when congressional oversight fails"},
                    {t: "Vesting Clause", d: "Language in Article II that limits the presidents specific powers"},
                    {t: "Judicial Activism", d: "Philosophy that courts should shape policy and expand rights"},
                    {t: "Legislate from the bench", d: "Criticism that judges are violating the separation of powers"},
                    {t: "Chevron Doctrine", d: "Former rule where courts deferred to agency interpretations"}
                ],
                sort: [
                    {f: "Vesting power in one president", b: "Executive"},
                    {f: "Determining if a law is unconstitutional", b: "Judicial"},
                    {f: "Voting to override a veto", b: "Legislative"},
                    {f: "Declaring a state of emergency", b: "Executive"},
                    {f: "Confirming human rights in court", b: "Judicial"},
                    {f: "Raising tariffs on foreign goods", b: "Executive"},
                    {f: "Passing necessary and proper laws", b: "Legislative"},
                    {f: "Deploying troops to a conflict", b: "Executive"},
                    {f: "Interpreting ambiguous statutes", b: "Judicial"},
                    {f: "Creating federal agencies like OSHA", b: "Legislative"},
                    {f: "Issuing a pardon", b: "Executive"},
                    {f: "Setting procedural rules for courts", b: "Judicial"},
                    {f: "Regulating interstate commerce", b: "Legislative"},
                    {f: "Firing an FTC commissioner", b: "Executive"},
                    {f: "Reviewing executive privilege claims", b: "Judicial"},
                    {f: "Conducting oversight hearings", b: "Legislative"},
                    {f: "Negotiating a treaty", b: "Executive"},
                    {f: "Appointing federal judges", b: "Executive"},
                    {f: "Confirming presidential appointments", b: "Legislative"},
                    {f: "Settling disputes between states", b: "Judicial"}
                ]
            }
        };

        let firstCard = null;
        let lockBoard = false;

        function launchGame(type) {
            const topic = document.getElementById('globalTopic').value;
            const stage = document.getElementById('game-stage');
            const data = database[topic];

            if(!data || data.match.length === 0) {
                alert("Data for this question is not loaded yet!");
                return;
            }

            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('game-arena').style.display = 'block';
            stage.innerHTML = "";

            if(type === 'match') {
                stage.innerHTML = `<h2>Evidence Match: ${topic}</h2><div class="match-grid" id="grid"></div>`;
                const grid = document.getElementById('grid');
                let cards = [];
                // We pick the first 8 items for a manageable 16-card grid
                data.match.slice(0, 8).forEach((item, i) => {
                    cards.push({txt: item.t, id: i}, {txt: item.d, id: i});
                });
                cards.sort(() => Math.random() - 0.5);

                cards.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = '???';
                    card.onclick = () => handleMatch(card, c);
                    grid.appendChild(card);
                });
            } else if(type === 'sort') {
                stage.innerHTML = `
                    <h2>Branch Sorter: ${topic}</h2>
                    <div class="sort-well" id="sortDisplay"></div>
                    <div class="bucket-container">
                        <div class="bucket" onclick="checkSort('Legislative')">Legislative</div>
                        <div class="bucket" onclick="checkSort('Executive')">Executive</div>
                        <div class="bucket" onclick="checkSort('Judicial')">Judicial</div>
                    </div>
                    <div id="score" style="margin-top:20px; font-weight:bold;">Score: 0</div>
                `;
                nextSort();
            }
        }

        function handleMatch(card, data) {
            if(lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            card.innerText = data.txt;

            if(!firstCard) {
                firstCard = {card, id: data.id};
            } else {
                if(firstCard.id === data.id) {
                    setTimeout(() => {
                        card.classList.add('matched');
                        firstCard.card.classList.add('matched');
                        firstCard = null;
                    }, 400);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        card.classList.remove('flipped');
                        card.innerText = '???';
                        firstCard.card.classList.remove('flipped');
                        firstCard.card.innerText = '???';
                        firstCard = null;
                        lockBoard = false;
                    }, 800);
                }
            }
        }

        let currentItem = null;
        let score = 0;
        function nextSort() {
            const topic = document.getElementById('globalTopic').value;
            const items = database[topic].sort;
            currentItem = items[Math.floor(Math.random() * items.length)];
            document.getElementById('sortDisplay').innerText = currentItem.f;
        }

        function checkSort(ans) {
            if(ans === currentItem.b) {
                score++;
                document.getElementById('score').innerText = "Score: " + score;
            } else {
                alert("Actually, " + currentItem.f + " is a " + currentItem.b + " power.");
            }
            nextSort();
        }

        function exitGame() {
            document.getElementById('lobby-view').style.display = 'block';
            document.getElementById('game-arena').style.display = 'none';
            firstCard = null;
        }

        function resetLobby() {
            exitGame();
        }
    </script>
</body>
</html>
